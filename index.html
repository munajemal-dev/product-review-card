<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Product preview card</title>

  
    <script src="https://cdn.tailwindcss.com"></script>


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "hsl(30, 38%, 92%)",
              "green-500": "hsl(158, 36%, 37%)",
              "green-700": "hsl(158, 42%, 18%)",
              black: "hsl(212, 21%, 14%)",
              grey: "hsl(228, 12%, 48%)",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
              serif: ["Fraunces", "serif"],
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="bg-cream font-sans min-h-screen flex items-center justify-center p-4 text-[14px]"
  >
   
    <main
      class="bg-white rounded-xl overflow-hidden max-w-[600px] grid grid-cols-1 sm:grid-cols-2 shadow-sm"
    >
   
      <picture class="w-full h-full">
     
        <img
          src="./images/image-product.jpg"
          alt="Gabrielle Essence Eau De Perfume bottle"
          class="w-full h-full object-cover"
        />
      </picture>

   
      <div class="p-6 sm:p-8 flex flex-col justify-between">
        <p
          class="uppercase tracking-[0.3em] text-grey text-xs font-medium mb-3"
        >
          Perfume
        </p>

        <h1 class="font-serif text-3xl font-bold text-black leading-tight mb-4">
          Gabrielle Essence Eau De Parfum
        </h1>

        <p class="text-grey leading-relaxed mb-6">
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>

        <div class="flex items-center gap-4 mb-6">
          <span class="font-serif text-3xl font-bold text-green-500">
            $149.99
          </span>
          <span class="text-xs text-grey line-through"> $169.99 </span>
        </div>

     
        <button
          class="w-full bg-green-500 hover:bg-green-700 active:scale-95 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-3 transition-all duration-150"
        >
          <img src="./images/icon-cart.svg" alt="" class="w-4 h-4" />
          Add to Cart
        </button>
      </div>
    </main>
  </body>
</html>
